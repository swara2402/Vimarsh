name: Research tests

on:
  pull_request:
    paths:
      - "research/**"
      - ".github/workflows/research-tests.yml"
      - "README.md"
  push:
    branches:
      - main
      - milestone32-review-accounting-fixes
      - milestone4-reliability-integration
    paths:
      - "research/**"
      - ".github/workflows/research-tests.yml"
      - "README.md"

jobs:
  research-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pandas numpy scipy scikit-learn joblib pyyaml matplotlib
      - name: Compile research source and experiment scripts
        run: python -m compileall -q src experiments
      - name: Run outcome validation tests
        run: python -m pytest -q tests/test_outcome_validation.py
      - name: Run reliability integration tests
        run: python -m pytest -q tests/verification/test_reliability_integration.py
      - name: Run calibration serialization tests
        run: python -m pytest -q tests/test_calibration_serialization.py
      - name: Run primary-model feature alignment tests
        run: python -m pytest -q tests/test_primary_model_feature_alignment.py
      - name: Run grouped-splitting tests
        run: python -m pytest -q tests/test_grouped_splitting.py
      - name: Run reliability batch feature tests
        run: python -m pytest -q tests/test_reliability_batch_features.py

  wine-end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: research
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install experiment dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scipy scikit-learn joblib pyyaml matplotlib seaborn requests
      - name: Train reliability models and save inference bundle
        run: python experiments/run_reliability_experiments.py
      - name: Run integrated reliability-driven verification
        run: python experiments/run_integrated_verification.py
      - name: Upload experiment results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vimarsh-milestone4-experiment-results
          path: |
            research/results/integrated_verification/
            research/results/reliability/metrics/
            research/docs/reliability-engine-report.md
            research/models/reliability/wine_quality_reliability_bundle.joblib
          if-no-files-found: warn
          retention-days: 14
