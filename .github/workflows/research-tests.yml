name: Research tests

on:
  pull_request:
    paths:
      - "research/**"
      - ".github/workflows/research-tests.yml"
  push:
    branches:
      - main
      - milestone32-review-accounting-fixes
      - milestone4-reliability-integration
    paths:
      - "research/**"
      - ".github/workflows/research-tests.yml"

jobs:
  research-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pandas numpy scipy scikit-learn joblib pyyaml
      - name: Run outcome validation tests
        run: python -m pytest -q tests/test_outcome_validation.py
      - name: Run reliability integration tests
        run: python -m pytest -q tests/verification/test_reliability_integration.py
      - name: Run calibration serialization tests
        run: python -m pytest -q tests/test_calibration_serialization.py
