services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: vimarsh-api:local
    environment:
      VIMARSH_RELIABILITY_BUNDLE: /app/research/models/reliability/wine_quality_reliability_bundle.joblib
      VIMARSH_CORS_ORIGINS: http://localhost:8080
      VIMARSH_RESEARCH_API_TOKEN: ${VIMARSH_RESEARCH_API_TOKEN:-}
      VIMARSH_OUTCOME_LEDGER_BACKEND: ${VIMARSH_OUTCOME_LEDGER_BACKEND:-jsonl}
      VIMARSH_OUTCOME_LEDGER: ${VIMARSH_OUTCOME_LEDGER:-/app/research/data/action_outcomes.jsonl}
    volumes:
      - ${VIMARSH_MODEL_DIR:-./research/models/reliability}:/app/research/models/reliability:ro
      - vimarsh-outcomes:/app/research/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  dashboard:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    image: vimarsh-dashboard:local
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"

volumes:
  vimarsh-outcomes:
